<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Synthesizer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f0f13;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  h1 {
    font-size: clamp(1.2rem, 3vw, 1.8rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #7eb8f7;
    margin-bottom: 24px;
    text-shadow: 0 0 20px rgba(126,184,247,0.4);
  }

  .synth-container {
    background: #1a1a24;
    border: 1px solid #2e2e42;
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 900px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  /* ── Controls Row ── */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 28px;
  }

  .panel {
    background: #12121c;
    border: 1px solid #2a2a3e;
    border-radius: 12px;
    padding: 16px 20px;
    flex: 1 1 200px;
  }

  .panel-title {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #6b7280;
    margin-bottom: 14px;
  }

  /* Waveform selector */
  .wave-buttons {
    display: flex;
    gap: 8px;
  }

  .wave-btn {
    flex: 1;
    padding: 8px 4px;
    background: #1e1e2e;
    border: 1px solid #3a3a52;
    border-radius: 8px;
    color: #9ca3af;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .wave-btn svg { width: 40px; height: 22px; }

  .wave-btn.active {
    background: #1e3a5f;
    border-color: #7eb8f7;
    color: #7eb8f7;
    box-shadow: 0 0 10px rgba(126,184,247,0.2);
  }

  .wave-btn:hover:not(.active) {
    background: #252535;
    border-color: #555;
  }

  /* ADSR */
  .adsr-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .adsr-knob {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .knob-label {
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #6b7280;
  }

  .knob-value {
    font-size: 0.65rem;
    color: #9ca3af;
    min-width: 36px;
    text-align: center;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: #2a2a3e;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #7eb8f7;
    box-shadow: 0 0 6px rgba(126,184,247,0.5);
    cursor: pointer;
  }

  input[type="range"].adsr-range {
    writing-mode: vertical-lr;
    direction: rtl;
    width: 4px;
    height: 60px;
  }

  input[type="range"].adsr-range::-webkit-slider-thumb {
    width: 14px;
    height: 14px;
  }

  /* Delay + Volume */
  .delay-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .toggle-label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    font-size: 0.8rem;
    color: #9ca3af;
  }

  .toggle-switch {
    position: relative;
    width: 40px;
    height: 22px;
  }

  .toggle-switch input { display: none; }

  .toggle-track {
    position: absolute;
    inset: 0;
    background: #2a2a3e;
    border-radius: 11px;
    transition: background 0.2s;
  }

  .toggle-thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 16px;
    height: 16px;
    background: #555;
    border-radius: 50%;
    transition: transform 0.2s, background 0.2s;
  }

  .toggle-switch input:checked ~ .toggle-track { background: #1e3a5f; }
  .toggle-switch input:checked ~ .toggle-thumb {
    transform: translateX(18px);
    background: #7eb8f7;
    box-shadow: 0 0 6px rgba(126,184,247,0.5);
  }

  .delay-params {
    display: flex;
    gap: 12px;
    flex: 1;
    min-width: 160px;
  }

  .delay-param {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }

  .delay-param label {
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #6b7280;
  }

  .delay-param span {
    font-size: 0.65rem;
    color: #9ca3af;
    text-align: center;
  }

  /* Volume */
  .vol-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .vol-row label {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #6b7280;
    white-space: nowrap;
  }

  /* ADSR Visualizer */
  .adsr-canvas-wrap {
    margin-top: 10px;
  }

  canvas#adsrCanvas {
    width: 100%;
    height: 70px;
    border-radius: 6px;
    background: #0d0d18;
  }

  /* ── Piano Keyboard ── */
  .keyboard-wrap {
    overflow-x: auto;
    padding-bottom: 8px;
  }

  .keyboard {
    display: flex;
    position: relative;
    height: 140px;
    user-select: none;
    min-width: 560px;
    margin: 0 auto;
  }

  .key {
    position: relative;
    cursor: pointer;
    border-radius: 0 0 6px 6px;
    transition: background 0.05s;
  }

  .key.white {
    width: 44px;
    height: 140px;
    background: linear-gradient(to bottom, #e8e8f0, #ffffff);
    border: 1px solid #aaa;
    border-top: none;
    z-index: 1;
    flex-shrink: 0;
  }

  .key.white:hover, .key.white.active {
    background: linear-gradient(to bottom, #b8d4f8, #dceffe);
  }

  .key.black {
    width: 28px;
    height: 88px;
    background: linear-gradient(to bottom, #222, #444);
    border: 1px solid #000;
    position: absolute;
    z-index: 2;
    border-radius: 0 0 4px 4px;
    top: 0;
  }

  .key.black:hover, .key.black.active {
    background: linear-gradient(to bottom, #1e3a5f, #3a6aaf);
  }

  .key-label {
    position: absolute;
    bottom: 8px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.55rem;
    color: #888;
    pointer-events: none;
    text-transform: uppercase;
  }

  .key.black .key-label { color: #aaa; bottom: 5px; font-size: 0.5rem; }

  /* Octave indicator */
  .octave-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    padding: 0 2px;
  }

  .octave-row span { font-size: 0.65rem; color: #4b5563; }

  .octave-btn {
    background: #1e1e2e;
    border: 1px solid #3a3a52;
    border-radius: 6px;
    color: #9ca3af;
    font-size: 0.75rem;
    padding: 4px 12px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .octave-btn:hover { background: #252535; border-color: #555; }

  /* Activity indicator */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    padding: 0 4px;
  }

  .active-note {
    font-size: 0.7rem;
    color: #6b7280;
  }

  .active-note span {
    color: #7eb8f7;
    font-weight: 600;
    min-width: 40px;
    display: inline-block;
  }

  .keyboard-hint {
    font-size: 0.65rem;
    color: #4b5563;
  }

  @media (max-width: 600px) {
    .synth-container { padding: 16px; }
    .adsr-grid { grid-template-columns: repeat(4, 1fr); }
    .key.white { width: 36px; }
    .key.black { width: 22px; }
  }
</style>
</head>
<body>

<h1>Web Synthesizer</h1>

<div class="synth-container">
  <div class="controls">

    <!-- Waveform -->
    <div class="panel">
      <div class="panel-title">Oscillator</div>
      <div class="wave-buttons">
        <button class="wave-btn active" data-wave="sine" onclick="setWave(this)">
          <svg viewBox="0 0 40 22" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M2 11 C8 2, 14 2, 20 11 C26 20, 32 20, 38 11"/>
          </svg>
          Sine
        </button>
        <button class="wave-btn" data-wave="square" onclick="setWave(this)">
          <svg viewBox="0 0 40 22" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="2,18 2,4 20,4 20,18 38,18 38,4"/>
          </svg>
          Square
        </button>
        <button class="wave-btn" data-wave="sawtooth" onclick="setWave(this)">
          <svg viewBox="0 0 40 22" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="2,18 20,4 20,18 38,4"/>
          </svg>
          Saw
        </button>
        <button class="wave-btn" data-wave="triangle" onclick="setWave(this)">
          <svg viewBox="0 0 40 22" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="2,18 11,4 29,18 38,4"/>
          </svg>
          Tri
        </button>
      </div>
    </div>

    <!-- ADSR -->
    <div class="panel">
      <div class="panel-title">Envelope (ADSR)</div>
      <div class="adsr-grid">
        <div class="adsr-knob">
          <span class="knob-label">Attack</span>
          <input type="range" class="adsr-range" id="attack" min="0.001" max="2" step="0.001" value="0.01" oninput="updateADSR()">
          <span class="knob-value" id="attackVal">10ms</span>
        </div>
        <div class="adsr-knob">
          <span class="knob-label">Decay</span>
          <input type="range" class="adsr-range" id="decay" min="0.001" max="2" step="0.001" value="0.1" oninput="updateADSR()">
          <span class="knob-value" id="decayVal">100ms</span>
        </div>
        <div class="adsr-knob">
          <span class="knob-label">Sustain</span>
          <input type="range" class="adsr-range" id="sustain" min="0" max="1" step="0.01" value="0.7" oninput="updateADSR()">
          <span class="knob-value" id="sustainVal">70%</span>
        </div>
        <div class="adsr-knob">
          <span class="knob-label">Release</span>
          <input type="range" class="adsr-range" id="release" min="0.001" max="3" step="0.001" value="0.3" oninput="updateADSR()">
          <span class="knob-value" id="releaseVal">300ms</span>
        </div>
      </div>
      <div class="adsr-canvas-wrap">
        <canvas id="adsrCanvas" height="70"></canvas>
      </div>
    </div>

    <!-- Delay + Volume -->
    <div class="panel">
      <div class="panel-title">Effects</div>

      <label class="toggle-label" style="margin-bottom:14px;">
        <div class="toggle-switch">
          <input type="checkbox" id="delayToggle" onchange="toggleDelay()">
          <div class="toggle-track"></div>
          <div class="toggle-thumb"></div>
        </div>
        Delay
      </label>

      <div class="delay-params">
        <div class="delay-param">
          <label for="delayTime">Time</label>
          <input type="range" id="delayTime" min="0.05" max="1" step="0.01" value="0.35" oninput="updateDelay(); document.getElementById('delayTimeVal').textContent=Math.round(this.value*1000)+'ms'">
          <span id="delayTimeVal">350ms</span>
        </div>
        <div class="delay-param">
          <label for="delayFeedback">Feedback</label>
          <input type="range" id="delayFeedback" min="0" max="0.85" step="0.01" value="0.35" oninput="updateDelay(); document.getElementById('delayFbVal').textContent=Math.round(this.value*100)+'%'">
          <span id="delayFbVal">35%</span>
        </div>
        <div class="delay-param">
          <label for="delayMix">Mix</label>
          <input type="range" id="delayMix" min="0" max="1" step="0.01" value="0.3" oninput="updateDelay(); document.getElementById('delayMixVal').textContent=Math.round(this.value*100)+'%'">
          <span id="delayMixVal">30%</span>
        </div>
      </div>

      <div class="vol-row" style="margin-top:16px;">
        <label for="masterVol">Volume</label>
        <input type="range" id="masterVol" min="0" max="1" step="0.01" value="0.6"
          oninput="masterGain.gain.value=parseFloat(this.value)">
      </div>
    </div>

  </div><!-- /controls -->

  <!-- Keyboard area -->
  <div class="octave-row">
    <button class="octave-btn" onclick="shiftOctave(-1)">− Octave</button>
    <span id="octaveDisplay">Octave 4</span>
    <button class="octave-btn" onclick="shiftOctave(1)">+ Octave</button>
  </div>

  <div class="keyboard-wrap">
    <div class="keyboard" id="keyboard"></div>
  </div>

  <div class="status-bar">
    <div class="active-note">Playing: <span id="noteDisplay">—</span></div>
    <div class="keyboard-hint">A S D F G H J K L · W E T Y U · Z/X octave</div>
  </div>
</div>

<script>
// ──────────────────────────────────────────────
//  Audio Context Bootstrap
// ──────────────────────────────────────────────
let ctx = null;
let masterGain, delayNode, feedbackGain, delayWetGain, delayDryGain;
let delayEnabled = false;

function initAudio() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();

  masterGain = ctx.createGain();
  masterGain.gain.value = 0.6;

  // Delay chain: dry/wet parallel
  delayNode     = ctx.createDelay(2.0);
  feedbackGain  = ctx.createGain();
  delayWetGain  = ctx.createGain();
  delayDryGain  = ctx.createGain();

  delayNode.delayTime.value  = 0.35;
  feedbackGain.gain.value    = 0.35;
  delayWetGain.gain.value    = 0;     // off initially
  delayDryGain.gain.value    = 1;

  // Signal flow:
  // masterGain → delayDryGain → ctx.destination
  // masterGain → delayNode   → feedbackGain → delayNode (loop)
  //                           → delayWetGain → ctx.destination
  masterGain.connect(delayDryGain);
  masterGain.connect(delayNode);
  delayNode.connect(feedbackGain);
  feedbackGain.connect(delayNode);
  delayNode.connect(delayWetGain);
  delayDryGain.connect(ctx.destination);
  delayWetGain.connect(ctx.destination);
}

// ──────────────────────────────────────────────
//  Synth State
// ──────────────────────────────────────────────
let waveform = 'sine';
let currentOctave = 4;

const adsr = { attack: 0.01, decay: 0.1, sustain: 0.7, release: 0.3 };

// active voices: noteId → { osc, gainNode }
const activeVoices = {};

function noteOn(freq, noteId) {
  initAudio();
  if (activeVoices[noteId]) return;

  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = waveform;
  osc.frequency.value = freq;

  const now = ctx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(1, now + adsr.attack);
  gain.gain.linearRampToValueAtTime(adsr.sustain, now + adsr.attack + adsr.decay);

  osc.connect(gain);
  gain.connect(masterGain);
  osc.start(now);

  activeVoices[noteId] = { osc, gain };
}

function noteOff(noteId) {
  const voice = activeVoices[noteId];
  if (!voice) return;
  const now = ctx.currentTime;
  const { gain, osc } = voice;
  gain.gain.cancelScheduledValues(now);
  gain.gain.setValueAtTime(gain.gain.value, now);
  gain.gain.linearRampToValueAtTime(0, now + adsr.release);
  osc.stop(now + adsr.release + 0.05);
  delete activeVoices[noteId];
}

// ──────────────────────────────────────────────
//  Note Frequencies
// ──────────────────────────────────────────────
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

function noteFreq(note, octave) {
  // A4 = 440 Hz, MIDI note 69
  const noteIndex = NOTE_NAMES.indexOf(note);
  const midi = (octave + 1) * 12 + noteIndex;
  return 440 * Math.pow(2, (midi - 69) / 12);
}

// ──────────────────────────────────────────────
//  Keyboard Layout (2 octaves shown)
// ──────────────────────────────────────────────
// white keys per octave: C D E F G A B
// black keys: C# D# _ F# G# A#

const KEYS_PER_OCT = [
  { note:'C',  black:false },
  { note:'C#', black:true  },
  { note:'D',  black:false },
  { note:'D#', black:true  },
  { note:'E',  black:false },
  { note:'F',  black:false },
  { note:'F#', black:true  },
  { note:'G',  black:false },
  { note:'G#', black:true  },
  { note:'A',  black:false },
  { note:'A#', black:true  },
  { note:'B',  black:false },
];

// PC keyboard map: key char → semitone offset from C of currentOctave
const KB_MAP = {
  'a':0,'w':1,'s':2,'e':3,'d':4,'f':5,'t':6,'g':7,'y':8,'h':9,'u':10,'j':11,
  'k':12,'o':13,'l':14,'p':15,';':16
};

const BLACK_OFFSETS = { 'C#':0.6, 'D#':1.6, 'F#':3.6, 'G#':4.6, 'A#':5.6 };
// white key index within octave
const WHITE_ORDER   = ['C','D','E','F','G','A','B'];

function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';

  const octaves = [currentOctave, currentOctave + 1];
  const whiteWidth = 44;

  let whiteCount = 0;
  const elements = [];

  octaves.forEach(oct => {
    KEYS_PER_OCT.forEach(({ note, black }) => {
      const key = document.createElement('div');
      key.classList.add('key', black ? 'black' : 'white');
      key.dataset.note = note;
      key.dataset.octave = oct;
      const id = note + oct;
      key.dataset.id = id;

      // Label
      const lbl = document.createElement('span');
      lbl.classList.add('key-label');

      if (!black) {
        // Find pc key for this note+oct
        const semitone = NOTE_NAMES.indexOf(note) - NOTE_NAMES.indexOf('C') +
                         (oct - currentOctave) * 12;
        const pcKey = Object.keys(KB_MAP).find(k => KB_MAP[k] === semitone);
        lbl.textContent = pcKey ? pcKey.toUpperCase() : '';
        key.style.left = (whiteCount * whiteWidth) + 'px';
        whiteCount++;
      } else {
        const whiteIdx = WHITE_ORDER.indexOf(note.replace('#','')) + (oct - currentOctave) * 7;
        const offset = (BLACK_OFFSETS[note] + (oct - currentOctave) * 7) * whiteWidth;
        key.style.left = (offset + whiteWidth * 0.6) + 'px';
      }

      key.appendChild(lbl);
      elements.push(key);

      // Mouse events
      key.addEventListener('mousedown', e => { e.preventDefault(); pressKey(note, oct, id); });
      key.addEventListener('mouseup',   () => releaseKey(id));
      key.addEventListener('mouseleave',() => releaseKey(id));
      key.addEventListener('touchstart', e => { e.preventDefault(); pressKey(note, oct, id); }, {passive:false});
      key.addEventListener('touchend',   e => { e.preventDefault(); releaseKey(id); });

      kb.appendChild(key);
    });
  });

  kb.style.width = (whiteCount * whiteWidth) + 'px';
}

function pressKey(note, octave, id) {
  const freq = noteFreq(note, octave);
  noteOn(freq, id);
  const el = document.querySelector(`[data-id="${id}"]`);
  if (el) el.classList.add('active');
  document.getElementById('noteDisplay').textContent = note + octave;
}

function releaseKey(id) {
  noteOff(id);
  const el = document.querySelector(`[data-id="${id}"]`);
  if (el) el.classList.remove('active');
  // clear display if no active voices
  if (Object.keys(activeVoices).length === 0) {
    document.getElementById('noteDisplay').textContent = '—';
  }
}

// ──────────────────────────────────────────────
//  PC Keyboard Handling
// ──────────────────────────────────────────────
const heldKeys = new Set();

document.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();

  if (k === 'z') { shiftOctave(-1); return; }
  if (k === 'x') { shiftOctave(1);  return; }

  if (KB_MAP[k] === undefined) return;
  if (heldKeys.has(k)) return;
  heldKeys.add(k);

  const semi = KB_MAP[k];
  const totalSemi = NOTE_NAMES.indexOf('C') + semi;
  const oct = currentOctave + Math.floor(semi / 12);
  const noteIdx = semi % 12;
  const note = NOTE_NAMES[noteIdx];
  const id = note + oct;
  pressKey(note, oct, id);
});

document.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (!heldKeys.has(k)) return;
  heldKeys.delete(k);

  const semi = KB_MAP[k];
  if (semi === undefined) return;
  const oct = currentOctave + Math.floor(semi / 12);
  const noteIdx = semi % 12;
  const note = NOTE_NAMES[noteIdx];
  const id = note + oct;
  releaseKey(id);
});

// ──────────────────────────────────────────────
//  Octave shift
// ──────────────────────────────────────────────
function shiftOctave(dir) {
  currentOctave = Math.max(1, Math.min(7, currentOctave + dir));
  document.getElementById('octaveDisplay').textContent = 'Octave ' + currentOctave;
  buildKeyboard();
}

// ──────────────────────────────────────────────
//  Waveform
// ──────────────────────────────────────────────
function setWave(btn) {
  waveform = btn.dataset.wave;
  document.querySelectorAll('.wave-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ──────────────────────────────────────────────
//  ADSR
// ──────────────────────────────────────────────
function updateADSR() {
  adsr.attack  = parseFloat(document.getElementById('attack').value);
  adsr.decay   = parseFloat(document.getElementById('decay').value);
  adsr.sustain = parseFloat(document.getElementById('sustain').value);
  adsr.release = parseFloat(document.getElementById('release').value);

  document.getElementById('attackVal').textContent  = fmtTime(adsr.attack);
  document.getElementById('decayVal').textContent   = fmtTime(adsr.decay);
  document.getElementById('sustainVal').textContent = Math.round(adsr.sustain * 100) + '%';
  document.getElementById('releaseVal').textContent = fmtTime(adsr.release);

  drawADSR();
}

function fmtTime(s) {
  return s < 1 ? Math.round(s * 1000) + 'ms' : s.toFixed(2) + 's';
}

function drawADSR() {
  const canvas = document.getElementById('adsrCanvas');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth;
  const H = canvas.clientHeight;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  const c = canvas.getContext('2d');
  c.scale(dpr, dpr);

  c.clearRect(0, 0, W, H);

  const pad = 8;
  const w = W - pad * 2;
  const h = H - pad * 2;

  // normalise times to fit in ~60% of width (leaving sustain + release)
  const total = adsr.attack + adsr.decay + 0.3 + adsr.release; // 0.3 = sustain hold
  const px = t => pad + (t / total) * w;

  const aEnd = adsr.attack;
  const dEnd = aEnd + adsr.decay;
  const sEnd = dEnd + 0.3;
  const rEnd = sEnd + adsr.release;

  const top    = pad;
  const bottom = pad + h;
  const sustainY = top + h * (1 - adsr.sustain);

  // Gradient fill
  const grad = c.createLinearGradient(0, top, 0, bottom);
  grad.addColorStop(0, 'rgba(126,184,247,0.35)');
  grad.addColorStop(1, 'rgba(126,184,247,0)');

  c.beginPath();
  c.moveTo(px(0),    bottom);
  c.lineTo(px(0),    bottom);
  c.lineTo(px(aEnd), top);
  c.lineTo(px(dEnd), sustainY);
  c.lineTo(px(sEnd), sustainY);
  c.lineTo(px(rEnd), bottom);
  c.closePath();
  c.fillStyle = grad;
  c.fill();

  // Stroke
  c.beginPath();
  c.moveTo(px(0),    bottom);
  c.lineTo(px(aEnd), top);
  c.lineTo(px(dEnd), sustainY);
  c.lineTo(px(sEnd), sustainY);
  c.lineTo(px(rEnd), bottom);
  c.strokeStyle = '#7eb8f7';
  c.lineWidth = 1.5;
  c.stroke();

  // Phase labels
  c.fillStyle = '#4b5563';
  c.font = `${9 * dpr / dpr}px sans-serif`;
  c.textAlign = 'center';
  c.fillText('A', px(aEnd/2), bottom - 2);
  c.fillText('D', px(aEnd + adsr.decay/2), bottom - 2);
  c.fillText('S', px(dEnd + 0.15), bottom - 2);
  c.fillText('R', px(sEnd + adsr.release/2), bottom - 2);
}

// ──────────────────────────────────────────────
//  Delay
// ──────────────────────────────────────────────
function toggleDelay() {
  delayEnabled = document.getElementById('delayToggle').checked;
  if (!ctx) return;
  const mix = parseFloat(document.getElementById('delayMix').value);
  delayWetGain.gain.value = delayEnabled ? mix : 0;
  delayDryGain.gain.value = 1;
}

function updateDelay() {
  if (!ctx) return;
  delayNode.delayTime.value = parseFloat(document.getElementById('delayTime').value);
  feedbackGain.gain.value   = parseFloat(document.getElementById('delayFeedback').value);
  if (delayEnabled) {
    delayWetGain.gain.value = parseFloat(document.getElementById('delayMix').value);
  }
}

// ──────────────────────────────────────────────
//  Init
// ──────────────────────────────────────────────
buildKeyboard();
updateADSR();

// Resize ADSR canvas on window resize
window.addEventListener('resize', () => {
  requestAnimationFrame(drawADSR);
});
</script>
</body>
</html>
